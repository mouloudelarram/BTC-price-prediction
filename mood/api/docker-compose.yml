version: '3.8'

services:
  # Ollama service for LLM models
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-server
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Mood Analysis API
  mood-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mood-api
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_ENVIRONMENT=production
      - API_DEBUG=false
      - OLLAMA_HOST=http://ollama:11434
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8000
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./output:/app/output
      - ./checkpoints:/app/checkpoints
      - ../scrapper/data_sourcing/output:/data/scrapper_output
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mood-network

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: mood-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - mood-api
    networks:
      - mood-network

volumes:
  ollama_data:

networks:
  mood-network:
    driver: bridge
